<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailBox Sample</title>

    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.css">

    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style/style.css">


</head>

<body>

    <!-- _______________header____________ -->

    <header>

        <h1 id="heading"></h1>

    </header>

    <!-- ____________main____________ -->

    <main class="container-fluid">

        <!-- ___________Section___________ -->

        <section id="container" class="row">

            <!-- ___________aside________________ -->

            <aside class="col-lg-2 p-0">

                <div id="w3s">

                    <img id="picw3s" src="" alt="">

                </div>


                <!-- ________________modal__________________ -->

                <nav>


                    <ul>
                        <li>

                            <!-- Button trigger modal -->
                            <section type="button" id="modal" data-bs-toggle="modal" data-bs-target="#exampleModal">
                            </section>

                            <!-- Modal -->
                            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                                aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header modal-head">
                                            <h1 class="modal-title" id="exampleModalLabel">Send Mail</h1>
                                            <button type="button" class="btn-close btn-close-white button-close"
                                                data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <label class="" for="to">To</label>
                                            <input class="d-block w-100 mb-3 p-1" type="email" id="to" required>
                                            <label class="" for="from">From</label>
                                            <input class="d-block w-100 mb-3 p-1" type="email" id="from" required>
                                            <label class="" for="Subject">Subject</label>
                                            <input class="d-block w-100 mb-3 p-1" type="email" id="Subject" required>
                                            <input class="desc d-block w-100 mb-3 px-2" type="text"
                                                placeholder="What's on your mind?">
                                        </div>
                                        <div class="modal-footer modal-foot">
                                            <button type="button" class="cancel butn cancel-btn"
                                                data-bs-dismiss="modal">Cancel<i class="bi bi-x"></i></button>
                                            <button type="button" class="send butn send-btn">Send<i
                                                    class="bi bi-send-fill"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </li>

                        <!-- _______________accordion_______________ -->

                        <li>


                            <div class="accordion accord" id="accordionExample">
                                <div class="accordion-item rounded-0">
                                    <h2 class="accordion-header">
                                        <button id="accordn" class="button-accord accordion-button button-accordion rounded-0"
                                            type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne"
                                            aria-expanded="true" aria-controls="collapseOne">

                                        </button>
                                    </h2>
                                    <div id="collapseOne" class="accordion-collapse  collapse show"
                                        data-bs-parent="#accordionExample">
                                        <div class="accordion-body p-0">

                                            <a onclick="showmail(0)" href="#">

                                                <div id="mailmembers" class="mailbox">

                                                    <div>

                                                        <img id="picone" src="" alt="" title="">
                                                        <h5 id="nameone"></h5>

                                                    </div>

                                                    <p id="subjectone"></p>
                                                    <p id="paraone"></p>
                                                </div>

                                            </a>

                                            <a onclick="showmail(1)" href="#">

                                                <div id="mailmembers" class="mailbox">

                                                    <div>

                                                        <img id="pictwo" src="" alt="" title="">
                                                        <h5 id="nametwo"></h5>

                                                    </div>

                                                    <p id="subjecttwo"></p>
                                                    <p id="paratwo"></p>
                                                </div>

                                            </a>

                                            <a onclick="showmail(2)" href="#">

                                                <div id="mailmembers" class="mailbox">

                                                    <div>

                                                        <img id="picthree" src="" alt="" title="">
                                                        <h5 id="namethree"></h5>

                                                    </div>

                                                    <p id="subjectthree"></p>
                                                    <p id="parathree"></p>
                                                </div>

                                            </a>
                                        </div>
                                    </div>
                                </div>
                                <div class="accordion-item">
                                    <h2 class="accordion-header">
                                        <button class="button-accord accordion-button button-accordion collapsed"
                                            type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo"
                                            aria-expanded="false" aria-controls="collapseTwo">
                                            <i class="bi bi-send-fill"></i>Sent
                                        </button>
                                    </h2>
                                    <div id="collapseTwo" class="accordion-collapse collapse"
                                        data-bs-parent="#accordionExample">
                                        <div class="accordion-body p-0">

                                            <a onclick="showmail(0)" href="#">

                                                <div id="mailmembers" class="mailbox">

                                                    <div>

                                                        <img id="picfour" src="" alt="" title="">
                                                        <h5 id="namefour"></h5>

                                                    </div>

                                                    <p id="subjectfour"></p>
                                                    <p id="parafour"></p>
                                                </div>

                                            </a>

                                        </div>
                                    </div>
                                </div>
                                <div class="accordion-item">
                                    <h2 class="accordion-header">
                                        <button class="button-accord accordion-button button-accordion collapsed"
                                            type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree"
                                            aria-expanded="false" aria-controls="collapseThree">
                                            <i class="bi bi-hourglass-bottom"></i>Drafts
                                        </button>
                                    </h2>
                                    <div id="collapseThree" class="accordion-collapse collapse"
                                        data-bs-parent="#accordionExample">
                                        <div class="accordion-body p-0">

                                            <a onclick="showmail(1)" href="#">

                                                <div id="mailmembers" class="mailbox">

                                                    <div>

                                                        <img id="picfive" src="" alt="" title="">
                                                        <h5 id="namefive"></h5>

                                                    </div>

                                                    <p id="subjectfive"></p>
                                                    <p id="parafive"></p>
                                                </div>

                                            </a>
                                        </div>
                                    </div>
                                </div>

                                <div class="accordion-item rounded-0">
                                    <h2 class="accordion-header">
                                        <button class="button-accord accordion-button button-accordion collapsed rounded-0"
                                            type="button" data-bs-toggle="collapse" data-bs-target="#collapsefour"
                                            aria-expanded="false" aria-controls="collapsefour">
                                            <i class="bi bi-trash3-fill"></i>Trash
                                        </button>
                                    </h2>
                                    <div id="collapsefour" class="accordion-collapse collapse"
                                        data-bs-parent="#accordionExample">
                                        <div class="accordion-body p-0">

                                            <a onclick="showmail(2)" href="#">

                                                <div id="mailmembers" class="mailbox">

                                                    <div>

                                                        <img id="picsix" src="" alt="" title="">
                                                        <h5 id="namesix"></h5>

                                                    </div>

                                                    <p id="subjectsix"></p>
                                                    <p id="parasix"></p>
                                                </div>

                                            </a>
                                        </div>
                                    </div>
                                </div>
                        </li>
                    </ul>
                </nav>


            </aside>

            <!-- _____________________article_______________________ -->

            <article class="col-lg-10">

                <figure>
                    <img id="photo" src="" alt="Picture" title="Picture">
                </figure>

                <h6 id="mailsubject"></h6>

                <h5 id="date"><i class="fa-regular fa-clock"></i></h5>

                <a href="#" id="reply"></a>

                <a href="#" id="forward"></a>

                <hr>

                <p id="parag"></p>

                <p id="desc"></p>

                <p id="info"></p>


            </article>
        </section>
    </main>







    <!-- ___________Script!!!_____________ -->

    <script src="node_modules/bootstrap/dist/js/bootstrap.js"></script>

    <script src="scripts/scripts.js"></script>

</body>

</html>
